<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OHFAS</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      font-family:
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;
      color: #111;
      background: #fff;
    }

    body {
      overflow-x: hidden;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    img {
      display: block;
      max-width: 100%;
    }

    /* ------------------------------
       HEADER
    ------------------------------ */

    .header {
      width: 100%;
      background: #fff;
      position: relative;
      z-index: 20;
    }

    .header-inner {
      max-width: 1240px;
      margin: 0 auto;
      padding: 38px 58px 36px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 40px;
    }

    .logo img {
      width: 255px;
      height: auto;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 52px;
      font-weight: 700;
      font-size: 18px;
      letter-spacing: 0.03em;
    }

    .nav a {
      white-space: nowrap;
    }

    .line-button {
      padding: 19px 34px;
      border-radius: 999px;
      background: #3db85b;
      color: #fff;
      font-size: 18px;
      font-weight: 700;
    }

    /* ------------------------------
       HERO
    ------------------------------ */

    .hero {
      position: relative;
      width: 100%;
    }

    .hero-image-wrap {
      position: relative;
      width: 100%;
      height: 540px;
      overflow: hidden;
    }

    .hero-image-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 35%;
    }

    /* 画像がまだ無いとき用 */
    .hero-placeholder {
      width: 100%;
      height: 100%;
      background:
        linear-gradient(
          135deg,
          #ddd8cf 0%,
          #bfc8c6 100%
        );
      display: flex;
      align-items: center;
      justify-content: center;
      color: #555;
      font-size: 16px;
    }

    /* 白い波 */
    .hero-wave {
      position: absolute;
      left: 0;
      bottom: -1px;
      width: 100%;
      height: 95px;
      z-index: 4;
      pointer-events: none;
    }

    .hero-wave svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* 青帯 */
    .hero-message {
      position: absolute;
      left: 0;
      bottom: 58px;
      z-index: 8;

      width: min(760px, 60vw);
      min-height: 110px;

      display: flex;
      align-items: center;

      padding: 12px 48px 15px 58px;

      background: #4aa9d0;
    }

    .hero-message-text {
      color: #fff;
      font-family:
        "Yu Mincho",
        "Hiragino Mincho ProN",
        serif;
      font-size: clamp(38px, 4.5vw, 70px);
      font-weight: 400;
      line-height: 1;
      letter-spacing: 0.02em;
      transform: rotate(-2deg);
      white-space: nowrap;
    }

    /* ------------------------------
       MESSAGE SECTION
    ------------------------------ */

    .intro {
      padding: 85px 60px 110px;
    }

    .intro-inner {
      max-width: 1120px;
      margin: 0 auto;
    }

    .intro-title {
      display: inline;
      position: relative;
      z-index: 1;

      font-size: clamp(34px, 4vw, 52px);
      line-height: 1.5;
      font-weight: 800;
      letter-spacing: 0.04em;
    }

    .intro-title::after {
      content: "";
      position: absolute;
      z-index: -1;
      left: -4px;
      right: -4px;
      bottom: 2px;
      height: 18px;
      background: #f6dce8;
    }

    .intro-text {
      margin-top: 42px;
      max-width: 720px;

      font-size: clamp(20px, 2vw, 28px);
      line-height: 2;
      letter-spacing: 0.02em;
      font-weight: 400;
    }

    /* ------------------------------
       MOBILE
    ------------------------------ */

    .menu-button {
      display: none;
    }

    @media (max-width: 900px) {

      .header-inner {
        padding: 24px 22px;
      }

      .logo img {
        width: 180px;
      }

      .nav,
      .line-button {
        display: none;
      }

      .menu-button {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 5px;

        width: 46px;
        height: 46px;
        border: 0;
        background: transparent;
        cursor: pointer;
      }

      .menu-button span {
        display: block;
        width: 28px;
        height: 2px;
        background: #111;
      }

      .hero-image-wrap {
        height: 470px;
      }

      .hero-message {
        width: 82%;
        bottom: 53px;
        min-height: 86px;
        padding: 14px 24px;
      }

      .hero-message-text {
        font-size: clamp(34px, 8vw, 54px);
      }

      .intro {
        padding: 62px 26px 90px;
      }

      .intro-text {
        font-size: 18px;
        line-height: 1.9;
      }
    }

    @media (max-width: 600px) {

      .header-inner {
        padding: 18px 18px;
      }

      .logo img {
        width: 150px;
      }

      .hero-image-wrap {
        height: 410px;
      }

      .hero-image-wrap img {
        object-position: 60% center;
      }

      .hero-wave {
        height: 62px;
      }

      .hero-message {
        width: 86%;
        bottom: 38px;
        min-height: 72px;
        padding: 10px 20px;
      }

      .hero-message-text {
        font-size: 31px;
      }

      .intro {
        padding: 52px 24px 75px;
      }

      .intro-title {
        font-size: 30px;
        line-height: 1.6;
      }

      .intro-title::after {
        height: 12px;
      }

      .intro-text {
        margin-top: 28px;
        font-size: 17px;
        line-height: 1.95;
      }
    }

  </style>
</head>

<body>

  <!-- HEADER -->
  <header class="header">
    <div class="header-inner">

      <a href="#" class="logo">
        <!--
          logo.png を同じフォルダに置く
        -->
        <img src="logo.png" alt="OHFAS">
      </a>

      <nav class="nav">
        <a href="#about">オーファス</a>
        <a href="#people">働くひと</a>
        <a href="#work">お仕事</a>
        <a href="#faq">よくある質問</a>
      </nav>

      <a href="#" class="line-button">
        LINEでつながる
      </a>

      <button class="menu-button" aria-label="メニューを開く">
        <span></span>
        <span></span>
        <span></span>
      </button>

    </div>
  </header>


  <!-- HERO -->
  <main>

    <section class="hero">

      <div class="hero-image-wrap">

        <!--
          hero.jpg を同じフォルダに置く
        -->
        <img
          src="hero.jpg"
          alt="オーファスで働くスタッフ"
          onerror="
            this.style.display='none';
            this.nextElementSibling.style.display='flex';
          "
        >

        <div
          class="hero-placeholder"
          style="display:none;"
        >
          hero.jpg
        </div>

        <!-- 青帯 -->
        <div class="hero-message">
          <div class="hero-message-text">
            ありがとうをつなぐ仕事を
          </div>
        </div>

        <!-- 白い波 -->
        <div class="hero-wave">
          <svg
            viewBox="0 0 1440 120"
            preserveAspectRatio="none"
            aria-hidden="true"
          >
            <path
              d="
                M0,52
                C170,95 330,111 480,108
                C620,105 720,67 875,71
                C1035,75 1150,103 1280,92
                C1350,87 1405,69 1440,50
                L1440,120
                L0,120
                Z
              "
              fill="#ffffff"
            />
          </svg>
        </div>

      </div>

    </section>


    <!-- MESSAGE -->
    <section class="intro">

      <div class="intro-inner">

        <h1 class="intro-title">
          つながったご縁に、ありがとう。
        </h1>

        <p class="intro-text">
          誰かがあなたを思い浮かべて、オーファスを紹介してくれたこと。<br>
          そして、あなたがこのページを開いてくれたこと。<br>
          そんな小さなご縁から、新しい仕事との出会いが生まれたら嬉しいです。
        </p>

      </div>

    </section>

  </main>

</body>
</html>
