<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>株式会社オーファス | リファラル採用専用サイト - このご縁に、ありがとう。</title>
  <meta name="description" content="株式会社オーファスのリファラル採用特設サイト。社員・スタッフから紹介を受けたあなたへ。建物を守り、安心を支える私たちの仕事や働く仲間をご紹介します。">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Sans+JP:wght@300;400;500;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       CSS VARIABLES & RESET
       ========================================================================== */
    :root {
      --color-primary: #005497;
      --color-primary-dark: #003e70;
      --color-primary-light: #e6f0f8;
      --color-secondary: #20a4af;
      --color-secondary-light: #e8f6f7;
      --color-gray: #c7ced3;
      --color-gray-light: #f5f7f9;
      --color-gray-border: #e2e8ed;
      --color-text-main: #2b333a;
      --color-text-sub: #5c6873;
      --color-accent: #ffef00;
      --color-white: #ffffff;
      
      --font-base: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-en: 'Outfit', 'Cinzel', sans-serif;
      --font-serif: 'Cinzel', serif;
      
      --shadow-sm: 0 2px 8px rgba(0, 84, 151, 0.06);
      --shadow-md: 0 8px 24px rgba(0, 84, 151, 0.08);
      --shadow-lg: 0 16px 40px rgba(0, 84, 151, 0.12);
      
      --header-h: 80px;
      --header-h-shrink: 64px;
      --container-max: 1200px;
      --transition-base: all 0.35s cubic-bezier(0.25, 1, 0.5, 1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
      font-size: 16px;
    }

    body {
      font-family: var(--font-base);
      color: var(--color-text-main);
      background-color: var(--color-white);
      line-height: 1.8;
      letter-spacing: 0.04em;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      padding-bottom: 0;
    }

    @media (max-width: 768px) {
      body {
        padding-bottom: 74px; /* Mobile Bottom CTA Offset */
      }
    }

    img {
      max-width: 100%;
      height: auto;
      display: block;
      vertical-align: middle;
    }

    a {
      color: inherit;
      text-decoration: none;
      transition: var(--transition-base);
    }

    button {
      font-family: inherit;
      background: none;
      border: none;
      cursor: pointer;
      color: inherit;
    }

    ul, ol {
      list-style: none;
    }

    /* Accessibility / Focus Visible */
    :focus-visible {
      outline: 2px solid var(--color-secondary);
      outline-offset: 3px;
    }

    /* Common Container */
    .container {
      width: 100%;
      max-width: var(--container-max);
      margin-inline: auto;
      padding-inline: 24px;
    }

    @media (max-width: 768px) {
      .container {
        padding-inline: 20px;
      }
    }

    /* Section Layout */
    .section {
      padding-block: 100px;
      position: relative;
    }

    @media (max-width: 768px) {
      .section {
        padding-block: 64px;
      }
    }

    .section--gray {
      background-color: var(--color-gray-light);
    }

    .section--primary {
      background-color: var(--color-primary);
      color: var(--color-white);
    }

    /* Section Headers */
    .sec-header {
      margin-bottom: 60px;
      position: relative;
    }

    @media (max-width: 768px) {
      .sec-header {
        margin-bottom: 40px;
      }
    }

    .sec-header--center {
      text-align: center;
    }

    .sec-en {
      display: inline-block;
      font-family: var(--font-en);
      font-size: 0.875rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      color: var(--color-secondary);
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .section--primary .sec-en {
      color: var(--color-accent);
    }

    .sec-title {
      font-size: 2.25rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      line-height: 1.35;
      color: var(--color-primary);
    }

    .section--primary .sec-title {
      color: var(--color-white);
    }

    @media (max-width: 768px) {
      .sec-title {
        font-size: 1.75rem;
      }
    }

    .sec-desc {
      margin-top: 16px;
      color: var(--color-text-sub);
      font-size: 1rem;
    }

    .section--primary .sec-desc {
      color: rgba(255, 255, 255, 0.85);
    }

    /* Marker Highlight */
    .marker-accent {
      background: linear-gradient(transparent 65%, var(--color-accent) 65%);
      display: inline;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 16px 36px;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      border-radius: 4px;
      transition: var(--transition-base);
      position: relative;
      overflow: hidden;
      gap: 10px;
    }

    .btn-primary {
      background-color: var(--color-primary);
      color: var(--color-white);
      border: 1px solid var(--color-primary);
    }

    .btn-primary:hover {
      background-color: var(--color-primary-dark);
      border-color: var(--color-primary-dark);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .btn-line {
      background-color: #06C755;
      color: var(--color-white);
      border: 1px solid #06C755;
    }

    .btn-line:hover {
      background-color: #05b34c;
      border-color: #05b34c;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(6, 199, 85, 0.25);
    }

    .btn-outline {
      background-color: transparent;
      color: var(--color-primary);
      border: 1px solid var(--color-primary);
    }

    .btn-outline:hover {
      background-color: var(--color-primary);
      color: var(--color-white);
      transform: translateY(-2px);
    }

    .btn-white {
      background-color: var(--color-white);
      color: var(--color-primary);
      border: 1px solid var(--color-white);
    }

    .btn-white:hover {
      background-color: var(--color-gray-light);
      color: var(--color-primary-dark);
      transform: translateY(-2px);
    }

    /* Scroll Reveal Baseline */
    .reveal {
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .reveal.is-revealed {
      opacity: 1;
      transform: translateY(0);
    }

    /* ==========================================================================
       1. HEADER
       ========================================================================== */
    .header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: var(--header-h);
      background-color: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 1000;
      transition: height 0.3s ease, background-color 0.3s ease, box-shadow 0.3s ease;
      border-bottom: 1px solid rgba(199, 206, 211, 0.4);
    }

    .header.is-shrink {
      height: var(--header-h-shrink);
      box-shadow: var(--shadow-sm);
    }

    .header__inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 100%;
    }

    .header__logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header__logo img {
      height: 36px;
      width: auto;
    }

    .header__logo-text {
      display: flex;
      flex-direction: column;
    }

    .header__logo-sub {
      font-size: 0.6875rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      color: var(--color-secondary);
      line-height: 1.2;
    }

    .header__logo-main {
      font-size: 0.8125rem;
      font-weight: 700;
      color: var(--color-primary);
      letter-spacing: 0.05em;
    }

    .header__nav {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .nav-list {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .nav-link {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--color-text-main);
      padding: 6px 0;
      position: relative;
    }

    .nav-link::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 2px;
      background-color: var(--color-primary);
      transition: width 0.3s ease;
    }

    .nav-link:hover,
    .nav-link.is-active {
      color: var(--color-primary);
    }

    .nav-link.is-active::after {
      width: 100%;
    }

    .header__line-btn {
      padding: 10px 20px;
      font-size: 0.875rem;
      border-radius: 4px;
    }

    /* Mobile Menu Toggle */
    .menu-btn {
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 44px;
      height: 44px;
      gap: 6px;
      z-index: 1001;
    }

    .menu-btn span {
      display: block;
      width: 24px;
      height: 2px;
      background-color: var(--color-primary);
      transition: var(--transition-base);
    }

    .menu-btn.is-active span:nth-child(1) {
      transform: translateY(8px) rotate(45deg);
    }

    .menu-btn.is-active span:nth-child(2) {
      opacity: 0;
    }

    .menu-btn.is-active span:nth-child(3) {
      transform: translateY(-8px) rotate(-45deg);
    }

    @media (max-width: 991px) {
      .header__nav {
        display: none;
      }
      .menu-btn {
        display: flex;
      }
    }

    /* Mobile Drawer */
    .mobile-menu {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      background-color: var(--color-white);
      z-index: 999;
      display: flex;
      flex-direction: column;
      padding: 100px 32px 40px;
      transform: translateX(100%);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      overflow-y: auto;
    }

    .mobile-menu.is-open {
      transform: translateX(0);
    }

    .mobile-menu__list {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 40px;
    }

    .mobile-menu__link {
      font-size: 1.125rem;
      font-weight: 600;
      color: var(--color-primary);
      display: block;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--color-gray-border);
    }

    /* ==========================================================================
       2. HERO SECTION
       ========================================================================== */
    .hero {
      position: relative;
      height: 100vh;
      min-height: 680px;
      display: flex;
      align-items: center;
      overflow: hidden;
      padding-top: var(--header-h);
    }

    .hero__bg {
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    .hero__slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      background-size: cover;
      background-position: center;
      transform: scale(1.06);
      transition: opacity 1.8s ease, transform 6s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .hero__slide.is-active {
      opacity: 1;
      transform: scale(1);
    }

    .hero__slide::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(255,255,255,0.96) 0%, rgba(255,255,255,0.85) 45%, rgba(255,255,255,0.3) 100%);
    }

    @media (max-width: 768px) {
      .hero__slide::after {
        background: linear-gradient(180deg, rgba(255,255,255,0.92) 0%, rgba(255,255,255,0.7) 100%);
      }
    }

    .hero__inner {
      position: relative;
      z-index: 2;
      max-width: 720px;
    }

    .hero__badge {
      display: inline-flex;
      align-items: center;
      padding: 6px 14px;
      background-color: var(--color-primary-light);
      color: var(--color-primary);
      font-family: var(--font-en);
      font-size: 0.8125rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      margin-bottom: 20px;
      border-left: 3px solid var(--color-secondary);
    }

    .hero__title {
      font-size: 3.25rem;
      font-weight: 700;
      line-height: 1.25;
      color: var(--color-primary);
      margin-bottom: 24px;
      letter-spacing: 0.05em;
    }

    @media (max-width: 768px) {
      .hero__title {
        font-size: 2.25rem;
      }
    }

    .hero__text {
      font-size: 1.0625rem;
      line-height: 1.9;
      color: var(--color-text-main);
      margin-bottom: 36px;
    }

    .hero__note {
      display: block;
      margin-top: 14px;
      font-weight: 700;
      color: var(--color-primary);
    }

    .hero__ctas {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 16px;
    }

    .hero__dots {
      position: absolute;
      bottom: 40px;
      right: 40px;
      z-index: 2;
      display: flex;
      gap: 12px;
    }

    .hero__dot {
      width: 32px;
      height: 3px;
      background-color: rgba(0, 84, 151, 0.25);
      border-radius: 2px;
      transition: var(--transition-base);
    }

    .hero__dot.is-active {
      background-color: var(--color-primary);
      width: 48px;
    }

    /* ==========================================================================
       3. MESSAGE SECTION
       ========================================================================== */
    .message-card {
      background-color: var(--color-white);
      border: 1px solid var(--color-gray-border);
      padding: 64px 48px;
      position: relative;
      box-shadow: var(--shadow-sm);
    }

    @media (max-width: 768px) {
      .message-card {
        padding: 40px 24px;
      }
    }

    .message-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background-color: var(--color-secondary);
    }

    .message__lead {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--color-primary);
      margin-bottom: 28px;
      line-height: 1.4;
    }

    @media (max-width: 768px) {
      .message__lead {
        font-size: 1.375rem;
      }
    }

    .message__body {
      font-size: 1.0625rem;
      line-height: 2;
      color: var(--color-text-main);
      margin-bottom: 32px;
    }

    .message__highlight {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--color-primary);
      padding: 16px 24px;
      background-color: var(--color-primary-light);
      border-radius: 4px;
      display: inline-block;
    }

    @media (max-width: 768px) {
      .message__highlight {
        font-size: 1.0625rem;
        display: block;
      }
    }

    /* ==========================================================================
       4. ABOUT OHFAS
       ========================================================================== */
    .about__grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 60px;
      align-items: center;
    }

    @media (max-width: 991px) {
      .about__grid {
        grid-template-columns: 1fr;
        gap: 40px;
      }
    }

    .about__copy {
      font-size: 2rem;
      font-weight: 700;
      color: var(--color-primary);
      line-height: 1.4;
      margin-bottom: 24px;
    }

    .about__desc {
      font-size: 1.0625rem;
      line-height: 1.9;
      color: var(--color-text-sub);
    }

    .about__visual {
      position: relative;
      padding-left: 20px;
      padding-top: 20px;
    }

    .about__visual::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 80%;
      height: 80%;
      border: 2px solid var(--color-secondary);
      z-index: 0;
    }

    .about__visual img {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 380px;
      object-fit: cover;
      box-shadow: var(--shadow-md);
    }

    /* ==========================================================================
       5. NUMBERS (DASHBOARD)
       ========================================================================== */
    .dashboard {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 24px;
    }

    .dash-card {
      background: var(--color-white);
      border: 1px solid var(--color-gray-border);
      padding: 32px 28px;
      border-radius: 4px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .dash-card--span-6 { grid-column: span 6; }
    .dash-card--span-4 { grid-column: span 4; }
    .dash-card--span-3 { grid-column: span 3; }

    @media (max-width: 991px) {
      .dash-card--span-6,
      .dash-card--span-4,
      .dash-card--span-3 {
        grid-column: span 6;
      }
    }

    @media (max-width: 640px) {
      .dash-card--span-6,
      .dash-card--span-4,
      .dash-card--span-3 {
        grid-column: span 12;
      }
    }

    .dash-card__label {
      font-size: 0.9375rem;
      font-weight: 700;
      color: var(--color-primary);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dash-card__label::before {
      content: '';
      display: inline-block;
      width: 6px;
      height: 6px;
      background-color: var(--color-secondary);
      border-radius: 50%;
    }

    .dash-metric {
      display: flex;
      align-items: baseline;
      gap: 6px;
      margin-bottom: 12px;
    }

    .dash-metric__num {
      font-family: var(--font-en);
      font-size: 3.5rem;
      font-weight: 700;
      line-height: 1;
      color: var(--color-primary);
    }

    .dash-metric__unit {
      font-size: 1.125rem;
      font-weight: 700;
      color: var(--color-text-sub);
    }

    /* Pie Chart: Gender */
    .pie-wrap {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .pie-chart {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: conic-gradient(
        var(--color-primary) 0deg,
        var(--color-primary) 0deg,
        var(--color-secondary) 0deg,
        var(--color-secondary) 360deg
      );
      transition: background 1.5s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      flex-shrink: 0;
    }

    .pie-chart::after {
      content: '';
      position: absolute;
      inset: 22px;
      background-color: var(--color-white);
      border-radius: 50%;
    }

    .pie-legend {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .pie-legend__item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9375rem;
      font-weight: 600;
    }

    .pie-legend__color {
      width: 12px;
      height: 12px;
      border-radius: 2px;
    }

    .pie-legend__color--men { background-color: var(--color-primary); }
    .pie-legend__color--women { background-color: var(--color-secondary); }

    /* Bar Charts */
    .bar-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    .bar-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .bar-item__meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--color-text-sub);
    }

    .bar-track {
      width: 100%;
      height: 8px;
      background-color: var(--color-gray-border);
      border-radius: 4px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      background-color: var(--color-primary);
      width: 0%;
      transition: width 1.2s cubic-bezier(0.16, 1, 0.3, 1);
      border-radius: 4px;
    }

    .bar-fill--secondary {
      background-color: var(--color-secondary);
    }

    /* ==========================================================================
       6. MVV SECTION
       ========================================================================== */
    .mvv-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 32px;
    }

    @media (max-width: 991px) {
      .mvv-grid {
        grid-template-columns: 1fr;
        gap: 24px;
      }
    }

    .mvv-card {
      background-color: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 40px 32px;
      border-radius: 4px;
      position: relative;
    }

    .mvv-card__tag {
      font-family: var(--font-en);
      font-size: 1.125rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      color: var(--color-accent);
      margin-bottom: 16px;
      display: block;
    }

    .mvv-card__title {
      font-size: 1.375rem;
      font-weight: 700;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .mvv-card__list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      color: rgba(255, 255, 255, 0.9);
      font-size: 0.9375rem;
    }

    .mvv-card__list li {
      position: relative;
      padding-left: 16px;
    }

    .mvv-card__list li::before {
      content: '・';
      position: absolute;
      left: 0;
      color: var(--color-accent);
    }

    /* ==========================================================================
       7. HISTORY SECTION (TIMELINE)
       ========================================================================== */
    .timeline {
      position: relative;
      max-width: 860px;
      margin-inline: auto;
      padding-block: 20px;
    }

    .timeline::before {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      left: 140px;
      width: 2px;
      background-color: var(--color-gray-border);
    }

    @media (max-width: 768px) {
      .timeline::before {
        left: 20px;
      }
    }
